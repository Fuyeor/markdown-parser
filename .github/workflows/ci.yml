# .github/workflows/ci.yml
name: Build and Push Playground

on:
  push:
    branches: ['main']
    # Only trigger when relevant code changes to save resources
    paths:
      - '.github/workflows/ci.yml'
      - 'crate/**'
      - 'fixture/**'
      - 'package/linkify/**'
      - 'package/parser/**'
      - 'package/lit-renderer**'
      - 'package/vue-renderer/**'
      - 'playground/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Dockerfile'

  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'crate/**'
      - 'fixture/**'
      - 'package/linkify/**'
      - 'package/parser/**'
      - 'package/lit-renderer**'
      - 'package/vue-renderer/**'
      - 'playground/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Dockerfile'
  workflow_dispatch:
    # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fuyeor/flavored-front-end

jobs:
  test-markdown-parser:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build linkify package
        run: pnpm --filter @ffm/linkify build
      - name: Typecheck parser package
        run: pnpm --filter @ffm/parser typecheck
      - name: Run parser unit tests
        run: pnpm --filter @ffm/parser test:unit
      - name: Run FFM regression tests
        run: pnpm --filter @ffm/parser test:ffm
      - name: Run safety fixture
        run: pnpm --filter @ffm/parser test:safety
      - name: Check Rust parser
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features

  build-markdown-playground:
    needs: test-markdown-parser
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Tags: latest and the short commit hash
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Enable GitHub Actions native cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
