# packages/markdown-parser-rust/Cargo.toml
[package]
name = "ffm-parser"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A lightweight Fuyeor Flavored Markdown parser and renderer."
repository = "https://github.com/Fuyeor/markdown-parser"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
